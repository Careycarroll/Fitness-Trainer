name: Build Android Debug APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'js/**'
      - 'index.html'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & sync Capacitor Android
        run: npm run cap:sync

      - name: Assemble Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-trainer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to rolling latest-android Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk fitness-trainer-debug.apk
          if gh release view latest-android >/dev/null 2>&1; then
            gh release upload latest-android fitness-trainer-debug.apk --clobber
            gh release edit latest-android --notes "Latest Android debug APK from commit ${{ github.sha }}"
          else
            gh release create latest-android fitness-trainer-debug.apk \
              --title "Latest Android Debug APK" \
              --notes "Latest Android debug APK from commit ${{ github.sha }}" \
              --prerelease
          fi
